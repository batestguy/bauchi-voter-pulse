name: rebuild-pages
on:
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: repo-pages-write
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Check asset authorization
        shell: bash
        # `awk -F,` is wrong for this file. `description` and `approval_note` contain
        # commas inside quotes, so field 6 is the sha256 on any such row and the gate
        # reads an approved asset as unapproved. The first scheduled run failed for
        # exactly that reason, on the derived apm-emblem row. Parse with the csv module
        # and look the column up by name, which is what the check always meant to do.
        run: |
          if python -c '
          import csv, sys
          with open("data/delivery/asset_register.csv", encoding="utf-8", newline="") as fh:
              bad = [r["file"] for r in csv.DictReader(fh)
                     if r.get("usage_status") != "campaign approved" or not r.get("approved_at")]
          if bad:
              print("Unapproved campaign assets: " + ", ".join(bad), file=sys.stderr)
              sys.exit(1)
          '; then
            :
          else
            echo "::error::Every campaign asset must be approved before public Pages publication."
            exit 1
          fi
      - run: python src/dashboard/render.py
      - name: Verify every generated page exists
        run: |
          missing=0
          for page in index achievements atlas poll agenda sources; do
            if [ ! -f "docs/${page}.html" ]; then
              echo "::error::docs/${page}.html was not generated. A page listed in PAGE_BUILDERS is missing from the build."
              missing=1
            fi
          done
          exit "$missing"
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Every generated page must be staged. Naming only docs/index.html renders
          # the other five but commits none of them, so the site silently keeps
          # publishing stale subpages.
          git add docs/*.html docs/assets/
          git diff --cached --quiet || git commit -m "chore(pages): rebuild APM Bauchi progress pages"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
