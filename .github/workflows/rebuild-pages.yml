name: rebuild-pages
on:
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: repo-pages-write
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Check asset authorization
        shell: bash
        run: |
          if awk -F, 'NR > 1 && $6 != "campaign approved" { bad = 1 } END { exit bad }' data/delivery/asset_register.csv; then
            :
          else
            echo "::error::Every campaign asset must be approved before public Pages publication."
            exit 1
          fi
      - run: python src/dashboard/render.py
      - name: Commit landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets/
          git diff --cached --quiet || git commit -m "chore(pages): rebuild APM Bauchi progress landing"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
