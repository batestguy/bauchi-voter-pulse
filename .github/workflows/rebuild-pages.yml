name: rebuild-pages
on:
  schedule:
    - cron: "0 6 * * MON"  # weekly Monday 06:00 UTC (after scrape.yml 05:30)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Delta-classify new raw rows
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_BIN: ${{ github.workspace }}/third_party/jev/jev
        run: |
          chmod +x third_party/jev/jev
          python -m src.classification.classify_new
      - run: python -m src.aggregation.aggregate
      - run: python src/dashboard/render.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/aggregates/ data/classified/ data/human_review/
          git diff --cached --quiet || git commit -m "chore(pages): weekly classify + aggregate + dashboard rebuild"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
